  <rect x="328" y="260" width="38" height="6" rx="3" fill="#dce9fb"/>
  <path d="M352 262.5v7M349 265.5l3-3 3 3" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI review bubble -->
  <rect x="412" y="120" width="188" height="118" rx="12" fill="#ffffff" stroke="#d7e0ea" stroke-width="1.5"/>
  <path d="M436 142l3.2 6.4 6.4 3.2-6.4 3.2-3.2 6.4-3.2-6.4-6.4-3.2 6.4-3.2z" fill="#2f6fb3"/>
