  <rect x="54" y="146" width="86" height="20" rx="10" fill="#f0f4f9" stroke="#dde5ee" stroke-width="1"/>
  <rect x="62" y="153" width="46" height="6" rx="3" fill="#c2cfdf"/>
  <rect x="148" y="146" width="112" height="20" rx="10" fill="#f0f4f9" stroke="#dde5ee" stroke-width="1"/>
  <rect x="156" y="153" width="72" height="6" rx="3" fill="#c2cfdf"/>
  <rect x="268" y="146" width="58" height="20" rx="10" fill="#fdf3e2" stroke="#f0d3a2" stroke-width="1"/>
  <rect x="276" y="153" width="30" height="6" rx="3" fill="#dfb878"/>

  <rect x="54" y="180" width="322" height="62" rx="8" fill="#fbfcfe" stroke="#e3e9f1" stroke-width="1"/>
  <circle cx="70" cy="196" r="3" fill="#2f6fb3"/>
  <rect x="80" y="193" width="44" height="6" rx="3" fill="#9db0c6"/>
  <rect x="132" y="193" width="150" height="6" rx="3" fill="#d5dfeb"/>
  <path d="M70 217h1" stroke="#e3e9f1" stroke-width="1"/>
