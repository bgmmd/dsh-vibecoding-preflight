  <path d="M404 176h20" stroke="#8aa4c0" stroke-width="2" stroke-linecap="round"/>
  <path d="m418 170 6 6-6 6" fill="none" stroke="#8aa4c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
