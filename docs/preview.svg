<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Git preflight button and result panel illustration">
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="640" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#e3ebf5"/>
    </linearGradient>
    <linearGradient id="p-btn" x1="440" y1="48" x2="584" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f6fb3"/>
      <stop offset="1" stop-color="#1d4e86"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" rx="16" fill="url(#p-bg)"/>

  <!-- Conversation header with the pill button -->
  <rect x="28" y="34" width="584" height="52" rx="12" fill="#ffffff" stroke="#d7e0ea" stroke-width="1.5"/>
  <circle cx="56" cy="60" r="10" fill="#e6edf6"/>
  <rect x="74" y="52" width="118" height="7" rx="3.5" fill="#c8d5e4"/>
  <rect x="74" y="65" width="72" height="6" rx="3" fill="#e0e8f2"/>
  <rect x="432" y="47" width="152" height="27" rx="13.5" fill="url(#p-btn)"/>
  <circle cx="450" cy="56.5" r="3.4" fill="none" stroke="#eaf2ff" stroke-width="1.8"/>
  <circle cx="450" cy="66.5" r="3.4" fill="none" stroke="#eaf2ff" stroke-width="1.8"/>
  <circle cx="459.5" cy="61" r="3.4" fill="none" stroke="#eaf2ff" stroke-width="1.8"/>
  <rect x="469" y="58" width="58" height="6" rx="3" fill="#dce9fb"/>
  <path d="m556 56 3.2 3.4 5.6-6.6" fill="none" stroke="#8ff0b4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Result panel: branch chips + commit list + actions -->
  <rect x="36" y="106" width="356" height="168" rx="12" fill="#ffffff" stroke="#d7e0ea" stroke-width="1.5"/>
  <circle cx="58" cy="128" r="4.5" fill="#2f6fb3"/>
  <rect x="70" y="124" width="92" height="8" rx="4" fill="#b9c8da"/>
  <rect x="332" y="120" width="12" height="12" rx="3" fill="#e7edf5"/>
